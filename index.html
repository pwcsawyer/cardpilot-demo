    const queuePage=()=>`${head()}${sectorTabs()}${moduleHead('业务队列','按岗位职责查看待办、授权状态与业务节点；勾选仅更新本地演示状态。')}<div class="grid-main">${queueCard()}<div class="side-stack">${roleCard()}<section class="card module-card"><h3 class="card-title">队列处理原则</h3><div class="role-checks">${['先确认客户授权、请求来源及业务目的','按服务时效与职责边界排序，不以自动评分作结论','疑难、投诉或资料异常事项转交有权岗位','所有更新留痕并在正式系统完成必要操作'].map((x,i)=>`<div class="role-check"><i>${String(i+1).padStart(2,'0')}</i><span>${x}</span></div>`).join('')}</div></section></div></div><div class="bottom-grid">${caseTable()}${funnelCard()}</div><div class="footer-note">任务勾选、筛选、新增内容均仅保存在当前浏览器 localStorage。</div>`;
    const schedulePage=()=>{const days=[['周一 · 12','今日日程'],['周二 · 13','预排事项'],['周三 · 14','预排事项'],['周四 · 15','协作日程'],['周五 · 16','周度回顾']];const agenda=role().queue;return `${head()}${sectorTabs()}${moduleHead('日程与任务','岗位日计划、协作节点与客户预约。新增任务只在当前浏览器保存。')}<section class="card card-pad" style="margin-bottom:12px"><div class="card-head"><div><h3 class="card-title">本周服务安排</h3><p class="card-sub">2026 年 10 月 12 日 – 10 月 16 日 · ${esc(role().name)}</p></div><span class="tag tag-gold">本周 18 项 · 4 项需确认</span></div><div class="schedule-grid">${days.map((d,di)=>`<div class="day-col"><div class="day-head">${d[0]}<span>${di===0?'今日':''}</span></div>${(di===0?agenda.slice(0,3):[`${di===1?'复核':'协作'} · ${agenda[di%agenda.length]}`,di===2?'团队服务回顾':'客户/合作方预约确认']).map((item,i)=>`<div class="event-card"><strong>${di===0?['10:20','11:30','14:00'][i]+' · '+item:item}</strong><span>${di===0?'待执行 · '+role().focus:di===4?'内部回顾 · 不涉及审批决策':'已安排 · 按授权与正式清单开展'}</span></div>`).join('')}</div>`).join('')}</div></section><div class="module-grid"><section class="card module-card"><div class="card-head"><div><h3 class="card-title">待办清单</h3><p class="card-sub">${esc(role().name)} · 选择完成状态更新本地演示数据</p></div><span class="count-pill">${queueList().filter(q=>!q.done).length} 项未完成</span></div>${queueList().map(item=>`<div class="list-row"><input class="queue-check" type="checkbox" data-done="${esc(item.id)}" ${item.done?'checked':''} aria-label="完成 ${esc(item.title)}"><div><strong>${esc(item.title)}</strong><span>${esc(item.name)} · ${esc(item.time)} · ${esc(item.action)}</span></div><span class="tag tag-${esc(item.tone)}">${esc(item.tag)}</span></div>`).join('')}</section><section class="card module-card"><h3 class="card-title">岗位日常节奏</h3><p class="card-sub">以服务质量和授权边界组织作业</p><div class="role-checks" style="margin-top:15px">${[['09:00','晨会：明确优先事项与责任人'],['10:00','处理已授权且临近时效的队列'],['13:30','协同处理跨团队待接收事项'],['16:30','复核未完结原因和客户回访安排']].map(x=>`<div class="role-check"><i>${x[0]}</i><span>${x[1]}</span></div>`).join('')}</div><div class="module-note" style="margin-top:14px">不得因自动化提醒而重复联系已拒绝或已撤回授权的客户。</div></section></div><div class="footer-note">日历与任务不连接真实员工日历、通知系统或外部服务。</div>`};
    const workflowsPage=()=>{const stages=state.sector==='retail'?['需求识别','授权核验','服务预约','事项协办','服务回顾']:state.sector==='cards'?['线索来源','授权联系','申请协助','账户服务','争议升级']:['经销商进件','材料清单协同','人工节点核验','合同协作','车辆交付'];const cards=state.sector==='retail'?[['存款到期服务','提前安排客户偏好的服务方式与预约；不自动生成产品建议。','客户服务 · 标准流程'],['财富需求协同','收集客户主动表达的目标，转持牌顾问完成适当性流程。','跨岗位协作 · 需适当性核验'],['资料更新协助','客户请求触发，仅通过获批渠道完成必要资料更新。','账户运营 · 受控数据']]:state.sector==='cards'?[['新户激活与权益服务','客户授权后，提供开卡、激活步骤及当前有效的权益条款。','客户服务 · 不承诺审批'],['申请材料协助','依据官方清单解释缺项，客户本人经发卡机构入口提交。','申请服务 · 官方入口'],['账单争议与投诉转办','识别争议/投诉信号后，及时进入正式争议处理队列。','服务升级 · 专责岗位']]:[['经销商进件协同','核对渠道、责任人和授权记录；正式申请由获批系统处理。','渠道运营 · 不做资信判断'],['资料缺项协同','按版本化清单记录缺项和责任方，不留存证件副本。','材料流转 · 人工复核'],['合同与交付安排','合同版本、签署和交付节点在正式系统核对并留痕。','合同运营 · 交付协同']];return `${head()}${sectorTabs()}${moduleHead('流程目录','从角色职责出发拆分日常旅程；流程卡片仅展示作业框架，不触发真实业务。','export')}<section class="card card-pad" style="margin-bottom:12px"><div class="card-head"><div><h3 class="card-title">${esc(sector().label)} · 标准服务旅程</h3><p class="card-sub">当前视图：${esc(role().name)} · 所有关键节点均需在正式系统核验</p></div><span class="tag tag-gray">框架示例</span></div><div class="workflow-grid">${stages.map((s,i)=>`<div class="workflow-card"><div class="workflow-top"><span class="workflow-num">STEP ${String(i+1).padStart(2,'0')}</span>${i===0?`<span class="tag tag-green">当前岗位</span>`:`<span class="tag tag-gray">按职责流转</span>`}</div><h3>${esc(s)}</h3><p>${esc(i===1?'确认处理依据、授权状态和适用范围。涉及专业判断时转交有权岗位。':'核对必需信息并记录责任人、下一步和服务时效。未经授权不跨系统查询或提交。')}</p><div class="workflow-meta"><span>${esc(role().name)}</span><span>${i===stages.length-1?'归档 / 回访':'人工核验'}</span></div></div>`).join('')}</div></section><div class="workflow-grid">${cards.map((c,i)=>`<article class="card workflow-card"><div class="workflow-top"><span class="tag tag-${['gold','blue','green'][i]}">${esc(sector().label)}</span>${icons.flow}</div><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p><div class="workflow-meta"><span>${esc(c[2])}</span><button class="card-link" data-action="workflow-detail" data-name="${esc(c[0])}">查看说明 ${icons.chevron}</button></div></article>`).join('')}</div><div class="module-note" style="margin-top:12px"><strong>重要边界：</strong>本工作台不执行客户身份核验、金融产品推荐、信用评分、审批、合同签署或外部消息发送。</div>`};
    const analyticsPage=()=>{const labels=['周一','周二','周三','周四','周五','周六'];const heights=[[42,30],[58,36],[49,46],[72,48],[66,58],[82,61]];return `${head()}${sectorTabs()}${moduleHead('经营分析','围绕服务质量、时效与流程健康度观察，不以单一转化指标驱动不当销售。','export')}<div class="score-grid">${[['按时服务率','94%'],['待接收协作','03'],['授权记录完整','98%']].map(x=>`<div class="score-box"><span>${x[0]} · 演示样例</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="module-grid"><section class="card chart-card"><div class="card-head"><div><h3 class="card-title">每周服务节点处理量</h3><p class="card-sub">按业务日期汇总 · 不代表业绩、审批通过或客户价值</p></div><span class="tag tag-gray">最近 6 个工作日</span></div><div class="chart-bars">${labels.map((l,i)=>`<div class="bar-group"><div class="bar-column"><i class="bar" style="height:${heights[i][0]}%"></i><i class="bar active" style="height:${heights[i][1]}%"></i></div><span class="bar-label">${l}</span></div>`).join('')}</div><div class="legend" style="margin-top:10px"><span><i class="muted"></i>新增事项</span><span><i></i>已完成服务节点</span></div></section><section class="card module-card"><div class="card-head"><div><h3 class="card-title">岗位服务质量</h3><p class="card-sub">只显示流程与服务口径</p></div>${icons.chart}</div>${[['客户授权留痕','96%'],['预约及时确认','91%'],['跨团队回执','88%'],['服务记录完整','98%']].map((x,i)=>`<div class="list-row"><span class="list-icon">${icons.check}</span><div><strong>${x[0]}</strong><span>团队汇总 · 虚构样例</span></div><span class="tag tag-${i===2?'amber':'green'}">${x[1]}</span></div>`).join('')}<div class="module-note" style="margin-top:10px">小样本演示数据不应作为员工绩效或客户差异化服务的依据。</div></section></div><div class="module-note" style="margin-top:12px"><strong>建议使用方式：</strong>关注授权缺失、未接收协作、超时服务、投诉升级和重复联系等流程风险；配合业务定义、指标口径与抽样复核。</div>`};
    const controlsPage=()=>`${head()}${sectorTabs()}${moduleHead('合规与质检','模拟只读治理视图：职责分离、授权留痕、版本管理与操作可追溯。','export')}<div class="module-grid"><section class="card module-card"><div class="card-head"><div><h3 class="card-title">演示审计事件</h3><p class="card-sub">只读样例 · 操作人、动作、对象和结果均为虚构</p></div><span class="tag tag-green">只读</span></div>${[['09:14','陈晓琳','查看授权核验状态','已记录'],['09:26','网点协同岗','分派客户服务事项','已记录'],['09:42','服务专员','更新流程节点摘要','已记录'],['10:02','合规抽样岗','查看标准话术版本','已记录'],['10:16','系统规则','拦截已撤回授权的提醒','已抑制']].map(x=>`<div class="audit-row"><span class="audit-time">${x[0]}</span><span class="audit-copy"><strong>${x[1]}</strong> · ${x[2]}</span><span class="access-tag">${x[3]}</span></div>`).join('')}</section><div class="side-stack"><section class="card module-card"><div class="card-head"><div><h3 class="card-title">边界与控制清单</h3><p class="card-sub">正式建设前需由相关负责人确认</p></div>${icons.shield}</div>${['按角色与组织授权访问，定期复核权限','联系前核验授权有效期、渠道与撤回状态','按最小必要原则处理业务字段，默认脱敏','导出、跨系统查询和流程变更需审批留痕','投诉、争议、欺诈等信号转专责团队处理'].map(x=>`<div class="list-row"><span class="list-icon">${icons.lock}</span><div><strong>${x}</strong><span>平台能力规划建议 · 当前并未接入</span></div></div>`).join('')}</section><section class="card module-card"><div class="module-note"><strong>合规边界：</strong>Demo 不连接生产数据，不提供自动审批、信贷判断、客户分层推荐或真实通知；本页记录为静态模拟样例。</div></section></div></div><div class="footer-note">不构成法律、合规或监管意见；上线前须由业务、合规、法律、隐私和信息安全团队核验。</div>`;
    const render=()=>{const body=({overview,clients:clientsPage,queue:queuePage,schedule:schedulePage,workflows:workflowsPage,analytics:analyticsPage,controls:controlsPage}[state.page]||overview)();document.getElementById('app').innerHTML=`${sidebar()}<main class="main">${topbar()}<div class="page">${body}</div></main>`;bindApp();};
    let toastTimer;const toast=msg=>{const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)};
    const persist=()=>{localStorage.setItem('cp-tasks',JSON.stringify(state.tasks));localStorage.setItem('cp-done',JSON.stringify(state.done));};
    const openTaskModal=()=>{document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-close="true"><form class="modal" id="taskForm"><div class="modal-head"><strong>新建岗位任务</strong><button type="button" class="modal-x" data-close="true">${icons.x}</button></div><div class="modal-body"><div class="module-note" style="margin-bottom:13px">当前业务：<strong>${esc(sector().label)} · ${esc(role().name)}</strong>。示例只存于当前浏览器，不输入真实客户身份或账户信息。</div><div class="field"><label for="taskTitle">任务事项</label><input id="taskTitle" name="title" required maxlength="70" placeholder="如：确认预约服务时段"></div><div class="form-grid"><div class="field"><label for="taskContact">关联对象（可选）</label><input id="taskContact" name="contact" maxlength="30" placeholder="使用代称或内部事项编号"></div><div class="field"><label for="taskTime">时间</label><input id="taskTime" name="time" type="time" value="15:30"></div></div><div class="form-grid"><div class="field"><label for="taskDue">截止日期</label><select id="taskDue" name="due"><option>今日</option><option>明日</option><option>本周</option></select></div><div class="field"><label for="taskPriority">优先级</label><select id="taskPriority" name="priority"><option>常规</option><option>高</option></select></div></div><div class="field"><label for="taskNote">协作说明（可选）</label><textarea id="taskNote" name="note" maxlength="120" placeholder="记录最小必要的下一步，不填写证件或账户信息"></textarea></div></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-close="true">取消</button><button class="btn btn-primary" type="submit">保存本地任务</button></div></form></div>`;document.getElementById('taskTitle').focus();};
    const openDetail=id=>{const item=queueList().find(x=>x.id===id);if(!item)return;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-close="true"><section class="modal"><div class="modal-head"><strong>业务事项摘要</strong><button class="modal-x" data-close="true">${icons.x}</button></div><div class="modal-body"><div class="field"><label>事项名称</label><div class="module-note"><strong>${esc(item.title)}</strong></div></div><div class="form-grid"><div class="field"><label>关联对象 / 事项代称</label><div class="module-note">${esc(item.name)}</div></div><div class="field"><label>责任岗位</label><div class="module-note">${esc(role().name)}</div></div></div><div class="field"><label>下一步</label><div class="module-note">${esc(item.action)} · ${esc(item.time)}</div></div><div class="field"><label>当前状态</label><div class="module-note">${esc(item.detail)}<br><br>此处仅为演示摘要。真实申请、身份资料和状态查询必须留在获批业务系统。</div></div></div><div class="modal-foot"><button class="btn btn-primary" data-close="true">完成</button></div></section></div>`;};
    const bindApp=()=>{const root=document.getElementById('app');root.onclick=e=>{const el=e.target.closest('[data-page],[data-sector],[data-action],[data-detail]');if(!el)return;if(el.dataset.page){state.page=el.dataset.page;state.search='';render();return}if(el.dataset.sector){setSector(el.dataset.sector);return}if(el.dataset.detail){openDetail(el.dataset.detail);return}if(el.dataset.action==='new-task'){openTaskModal();return}if(el.dataset.action==='alerts'){toast('通知中心为演示占位；当前无外部消息发送。');return}if(el.dataset.action==='export'){toast('已生成演示摘要预览；未导出客户明细。');return}if(el.dataset.action==='workflow-detail'){toast(`${el.dataset.name}：请按获批流程与岗位权限操作。`);return}};
      root.onchange=e=>{if(e.target.id==='roleSelect'){state.role=Number(e.target.value);localStorage.setItem('cp-role',String(state.role));render()}if(e.target.id==='queueFilter'){state.filter=e.target.value;render()}if(e.target.matches('[data-done]')){state.done[e.target.dataset.done]=e.target.checked;persist();render()}};
      const search=document.getElementById('globalSearch');search.oninput=e=>{state.search=e.target.value;if(state.page==='overview'||state.page==='queue')renderSearchQueue()};
    };
    const renderSearchQueue=()=>{const box=document.querySelector('.queue-list');if(!box)return;const rows=queueRows().slice(0,5);box.innerHTML=rows.length?rows.map(item=>`<div class="queue-item ${item.done?'queue-complete':''}"><input class="queue-check" type="checkbox" data-done="${esc(item.id)}" ${item.done?'checked':''} aria-label="完成 ${esc(item.title)}"><div class="queue-copy"><div class="queue-title">${esc(item.title)}<span class="tag tag-${esc(item.tone)}">${esc(item.tag)}</span></div><div class="queue-detail">${esc(item.detail)}</div><div class="queue-meta"><span>${icons.people}${esc(item.name)}</span><span>${icons.file}${esc(item.action)}</span></div></div><div class="queue-side"><span class="due">${esc(item.time)}</span><button class="card-link" data-detail="${esc(item.id)}">查看事项</button></div></div>`).join(''):'<div class="module-note">没有匹配的业务事项。</div>'};
    document.addEventListener('click',e=>{if(e.target.closest('[data-close]')){document.getElementById('modal-root').innerHTML=''}});
    document.addEventListener('submit',e=>{if(e.target.id!=='taskForm')return;e.preventDefault();const d=new FormData(e.target);const item={id:`task-${Date.now()}`,sector:state.sector,title:String(d.get('title')||'').trim(),contact:String(d.get('contact')||'').trim(),time:String(d.get('time')||''),due:String(d.get('due')||'今日'),priority:String(d.get('priority')||'常规'),note:String(d.get('note')||'').trim()};if(!item.title)return;state.tasks.unshift(item);persist();document.getElementById('modal-root').innerHTML='';render();toast('任务已保存在当前浏览器的演示数据中。')});
    render();
  })();
